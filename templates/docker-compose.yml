name: ${STACK_NAME:-neonx-ai-agent}

services:
  ai_agent:
    image: ghcr.io/openclaw/openclaw:latest
    # container_name: ${CONTAINER_NAME:-neonx_ai_agent}

    restart: unless-stopped

    stdin_open: true
    tty: true

    entrypoint: ["/bin/sh", "/bootstrap/entrypoint.sh"]
    user: "0:0"

    volumes:
      - ./agent_data:/home/node/.openclaw
      - ./projects:/home/node/.openclaw/projects
      - ./bootstrap:/bootstrap:ro
      - ../../extensions:/extensions:ro
    env_file:
      - .env
      - path: ../../.env.meta
        required: false
    environment:
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_GATEWAY_PASSWORD: "changeme"
      OPENCLAW_HOME: /home/node
      BASE_URL: ${BASE_URL:-http://ai_gateway:20128/v1}
      API_KEY: ${API_KEY:-sk-aea5c2d612c2e3dd-sd6l75-8a587593}
      MODEL: ${MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      STACK_NAME: ${STACK_NAME:-neonx-ai-agent}

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    # Default: publish ports to host
    # For clients running multiple containers on same host, replace with:
    # expose:
    #   - "18789"
    #   - "8001"
    ports:
      - "${HOST_PORT_18789:-}:18789"
      - "${HOST_PORT_8001:-}:8001"
    networks:
      neonx-network:
        aliases:
          - ${STACK_NAME:-neonx-ai-agent}

networks:
  neonx-network:
    external: true