name: ${STACK_NAME:-neonx-ai-agent}

services:
  ai_agent:
    image: openclaw/openclaw:2026.6.34
    # container_name: ${CONTAINER_NAME:-neonx_ai_agent}

    restart: unless-stopped

    stdin_open: true
    tty: true

    entrypoint: ["/bin/sh", "/bootstrap/entrypoint.sh"]
    user: "0:0"

    volumes:
      - ./agent_data:/home/node/.openclaw
      - ./projects:/home/node/.openclaw/projects
      - ./bootstrap:/bootstrap:ro
      - ../../extensions:/extensions:ro
      # Persistent Codex CLI state (auth, sessions) for openclaw-codex-app-server
      - codex_home:/home/node/.codex
    env_file:
      - .env
      - path: ../../.env.meta
        required: false
    environment:
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_GATEWAY_PASSWORD: "changeme"
      OPENCLAW_HOME: /home/node
      BASE_URL: ${BASE_URL:-http://ai_gateway:20128/v1}
      API_KEY: ${API_KEY:-sk-aea5c2d612c2e3dd-sd6l75-8a587593}
      MODEL: ${MODEL:-}
      API: ${API:-openai-completions}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      CHAT_BOT: ${CHAT_BOT:-}
      STACK_NAME: ${STACK_NAME:-neonx-ai-agent}
      # Codex CLI (used by openclaw-codex-app-server plugin)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_APP_SERVER_WORKSPACE_DIR: ${CODEX_APP_SERVER_WORKSPACE_DIR:-}
      CODEX_APP_SERVER_MODEL: ${CODEX_APP_SERVER_MODEL:-}
      CODEX_APP_SERVER_TRANSPORT: ${CODEX_APP_SERVER_TRANSPORT:-}
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-}

    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 1G
    #     reservations:
    #       cpus: "0.25"
    #       memory: 256M

    # Default: publish ports to host
    # For clients running multiple containers on same host, replace with:
    # expose:
    #   - "18789"
    #   - "8001"
    ports:
      - "${HOST_PORT_18789:-}:18789"
      - "${HOST_PORT_8001:-}:8001"
    networks:
      neonx-network:
        aliases:
          - ${STACK_NAME:-neonx-ai-agent}

networks:
  neonx-network:
    external: true

volumes:
  codex_home: