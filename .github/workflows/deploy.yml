name: NeonX AI Agent Deploy

on:
  push:
    branches:
      - "dev"
      # - "main"

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/dev' && 'DEV' || 'MAIN' }}
    env:
      # Change the service name based on the branch being deployed
      SERVICE_NAME: neonx_ai_agent_${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
      #
      NODE_ENV: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
      OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # Connect to VPN if config provided
      - name: Install OpenVPN
        if: ${{ env.OPENVPN_CONFIG != '' }}
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Restore OVPN file
        if: ${{ env.OPENVPN_CONFIG != '' }}
        run: |
          printf "%s" "$OPENVPN_CONFIG" > client.ovpn

      - name: Connect VPN
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: client.ovpn

      - name: Remove temporary VPN files
        run: rm -f client.ovpn openvpn.log openvpn.pid
      # Connect to VPN if config provided

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'openclaw-message-listener/package-lock.json'

      - name: Install dependencies
        run: |
          cd openclaw-message-listener
          npm ci

      - name: Build project
        run: |
          cd openclaw-message-listener
          npm run build

      - name: Fix permissions for built files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Show user"
            whoami

            echo ">>> Move to project directory"
            cd ~/apps/${{ env.SERVICE_NAME }}

            # Fix permissions on server for the dist directory
            chmod -R 755 openclaw-message-listener/dist
            chmod 644 openclaw-message-listener/dist/*

      - name: Copy code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml,entrypoint.sh,openclaw-message-listener/dist"
          target: "~/apps/${{ env.SERVICE_NAME }}"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Show user"
            whoami

            echo ">>> Move to project directory"
            cd ~/apps/${{ env.SERVICE_NAME }}

            if [[ $(docker network create -d bridge neonx-network) ]]; \
            then \
              echo "Created neonx-network" \
            else \
              echo "Network found"; \
            fi

            docker compose up -d --force-recreate
            docker image prune -f --filter "until=24h"