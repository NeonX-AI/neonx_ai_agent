name: NeonX AI Agent Deploy

on:
  push:
    branches:
      - "dev"
      - "Server_02"

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      # Change the service name based on the branch being deployed
      SERVICE_NAME: neonx_ai_agent${{ github.ref == 'refs/heads/dev' && '_dev' || '' }}
      #
      NODE_ENV: ${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
      OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # Connect to VPN if config provided
      - name: Install OpenVPN
        if: ${{ env.OPENVPN_CONFIG != '' }}
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Restore OVPN file
        if: ${{ env.OPENVPN_CONFIG != '' }}
        run: |
          printf "%s" "$OPENVPN_CONFIG" > client.ovpn

      - name: Connect VPN
        if: ${{ env.OPENVPN_CONFIG != '' }}
        uses: kota65535/github-openvpn-connect-action@v3
        with:
          config_file: client.ovpn
      
      - name: Remove temporary VPN files
        run: rm -f client.ovpn openvpn.log openvpn.pid
      # Connect to VPN if config provided

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'templates/openclaw-message-listener/package-lock.json'

      - name: Install dependencies
        run: |
          cd templates/openclaw-message-listener
          npm ci

      - name: Build project
        run: |
          cd templates/openclaw-message-listener
          npm run build

      - name: Fix permissions for built files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Show user"
            whoami

            echo ">>> Move to project directory"
            cd ~/apps/${{ env.SERVICE_NAME }}

            # Fix permissions on server for the dist directory
            if [ -d "templates/openclaw-message-listener/dist" ]; then
              chmod -R 755 templates/openclaw-message-listener/dist
              chmod 644 templates/openclaw-message-listener/dist/*
            else
              echo ">>> dist directory not found, skipping permission fix"
            fi

      - name: Copy code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "templates/docker-compose.yml,templates/entrypoint.sh,update-clients.sh,create-client.sh,templates/openclaw-message-listener/dist"
          target: "~/apps/${{ env.SERVICE_NAME }}"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Show user"
            whoami

            echo ">>> Move to project directory"
            cd ~/apps/${{ env.SERVICE_NAME }}

            echo ">>> Run deploy script"
            chmod +x update-clients.sh
            ./update-clients.sh