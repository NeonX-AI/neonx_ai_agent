services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw

    restart: unless-stopped

    stdin_open: true
    tty: true

    command: openclaw gateway

    volumes:
      - ./openclaw-data:/home/node

    networks:
      - neonx_network

networks:
  neonx_network:
    external: true