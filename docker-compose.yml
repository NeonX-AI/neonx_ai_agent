services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: neonx_ai_agent

    restart: unless-stopped

    stdin_open: true
    tty: true

    command: openclaw gateway
    # command: tail -f /dev/null

    volumes:
      - openclaw-data:/home/node
    ports:
      - "18789:18789"
    networks:
      - neonx-network

networks:
  neonx-network:
    external: true

volumes:
  openclaw-data: