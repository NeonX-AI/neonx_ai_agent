services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: neonx_ai_agent

    restart: unless-stopped

    stdin_open: true
    tty: true

    # command: openclaw gateway
    command: tail -f /dev/null # for first time run, to enter the container and run the command manually

    environment:
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_GATEWAY_PASSWORD: "changeme"

    volumes:
      - openclaw-data:/home/node
    networks:
      - neonx-network

  nginx:
    image: nginx:alpine
    container_name: neonx_ai_agent_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - openclaw
    networks:
      - neonx-network

networks:
  neonx-network:
    external: true

volumes:
  openclaw-data: