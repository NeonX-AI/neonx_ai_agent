services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.7.1
    container_name: neonx_ai_agent

    restart: unless-stopped

    stdin_open: true
    tty: true

    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    user: "0:0"

    volumes:
      - ./agent_data:/home/node/.openclaw
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./openclaw-message-listener/dist:/app/dist/extensions/openclaw-message-listener:ro
    environment:
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_GATEWAY_PASSWORD: "changeme"
      OPENCLAW_HOME: /home/node
      
    ports:
      - "18789:18789"
      - "8001:8001" # For download files from the agent
    networks:
      - neonx-network

networks:
  neonx-network:
    external: true