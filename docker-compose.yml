services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: neonx_ai_agent

    restart: unless-stopped

    stdin_open: true
    tty: true

    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    user: "0:0"

    environment:
      TZ: Asia/Ho_Chi_Minh
      OPENCLAW_GATEWAY_PASSWORD: "changeme"
      OPENCLAW_HOME: /home/node

    volumes:
      - ./agent_data:/home/node/.openclaw
      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        read_only: false
    ports:
      - "18789:18789"
    networks:
      - neonx-network

networks:
  neonx-network:
    external: true